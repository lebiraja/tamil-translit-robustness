<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanglish to Tamil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f8fd;--ink:#0a0f1c;--ink2:#2b3752;--mut:#55627a;--line:#c9d6ec;--grid:#dce6f7;--acc:#0b5cff;--accsoft:#e3edff;--accglow:#a9c6ff;--card:#ffffff;--sel:#e3edff;
--ta:"Noto Sans Tamil","Latha","Nirmala UI","Lohit Tamil","Tamil Sangam MN",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(90deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 48px),repeating-linear-gradient(180deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 48px);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh}
main{max-width:860px;margin:0 auto;padding:44px 20px 80px;position:relative}
main::before{content:"";position:absolute;top:24px;right:20px;width:32px;height:32px;border-top:3px solid var(--acc);border-right:3px solid var(--acc)}
.tag{font:12px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
h1{font:700 clamp(32px,6vw,52px)/1.08 var(--sans);margin:0 0 10px;letter-spacing:-.02em}
h1 em{color:var(--acc);font-style:normal}
.sub{color:var(--ink2);margin:0 0 30px;max-width:56ch}
label{display:block;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:22px/1.5 var(--mono);padding:16px 18px;outline:none;box-shadow:0 16px 40px #d6e3f8}
textarea:focus{border-color:var(--acc)}
textarea::placeholder{color:#9aa8c2}
.out{margin-top:28px;min-height:130px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 18px 18px;font:34px/1.9 var(--ta);overflow-wrap:anywhere;box-shadow:0 16px 40px #d6e3f8}
.out .lit{color:var(--ink2);white-space:pre-wrap}
.w{position:relative;display:inline-block;cursor:pointer;border-radius:4px;padding:0 3px;margin:0 -3px}
.w:hover,.w.open{background:var(--sel)}
.w:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.w .alt{position:absolute;left:0;top:100%;z-index:5;white-space:nowrap;width:max-content;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 16px 40px #a9c6ff99;font-size:24px;line-height:1.4}
.alt button{white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;gap:18px;width:100%;background:none;border:0;color:var(--ink);padding:4px 8px;border-radius:4px;cursor:pointer;font:inherit;text-align:left}
.alt button:hover{background:var(--sel)}
.w.en{font:600 22px var(--mono);color:var(--ink2);border:1px dashed var(--line);padding:0 8px;margin:0 2px;vertical-align:middle}
.alt small{font:11px var(--mono);color:var(--mut)}
.alt button.cur{color:var(--acc)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;font:12px var(--mono);color:var(--mut)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:600 13px var(--mono);cursor:pointer;box-shadow:0 8px 24px #a9c6ff}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.try{margin-top:34px}
.try button{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 12px;margin:0 8px 8px 0;font:13px var(--mono);cursor:pointer}
.try button:hover{border-color:var(--acc);color:var(--acc)}
footer{margin-top:54px;font:12px/1.7 var(--mono);color:var(--mut)}
footer b{color:var(--ink);font-weight:500}
input[type=checkbox]{accent-color:var(--acc)}
@media(max-width:560px){.out{font-size:28px}textarea{font-size:18px}}
</style>
</head>
<body>
<main>
  <p class="tag">NLP · IA3 · Text normalisation</p>
  <h1>Type Tanglish.<br>Get <em>தமிழ்</em>.</h1>
  <p class="sub">A character-level transformer trained on real romanizations and noisy typing. Click any word to see the other candidates.</p>

  <label for="in">Tanglish</label>
  <textarea id="in" autofocus spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="vanakkam, eppadi irukkinga?"></textarea>

  <div class="out" id="out" aria-live="polite"></div>
  <div class="row"><button class="btn" id="copy">Copy Tamil</button><button class="btn ghost" id="clear">Clear</button><label style="margin:0;display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer"><input type="checkbox" id="keepen" checked> keep English words</label><span id="ms"></span></div>

  <div class="try"><label>Try</label>
    <button>vanakkam nanba</button><button>naan inniki office poren</button><button>enna panra</button><button>nalla irukken</button><button>kankl</button><button>romba nandri</button>
  </div>

  <footer id="info"></footer>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
let parts=[],chosen=[],forced=[],timer=null,seq=0;
function render(){
  const out=$("#out");out.textContent="";
  parts.forEach((p,i)=>{
    if(p.literal!==undefined){const s=document.createElement("span");s.className="lit";s.textContent=p.literal;out.append(s);return}
    const keep=$("#keepen").checked&&p.english&&!forced[i];
    if(keep){const e=document.createElement("span");e.className="w en";e.tabIndex=0;e.textContent=p.src;e.title="English word kept as typed. Click to convert to Tamil anyway.";
      e.onclick=ev=>{ev.stopPropagation();forced[i]=true;render()};e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();e.click()}};out.append(e);return}
    const w=document.createElement("span");w.className="w";w.tabIndex=0;w.textContent=p.cands[chosen[i]||0];w.title=p.src;
    const open=()=>{closeAll();w.classList.add("open");const a=document.createElement("div");a.className="alt";
      p.cands.forEach((c,k)=>{const b=document.createElement("button");b.className=k===(chosen[i]||0)?"cur":"";
        b.innerHTML="";const t=document.createElement("span");t.textContent=c;const r=document.createElement("small");r.textContent="#"+(k+1);b.append(t,r);
        b.onclick=e=>{e.stopPropagation();chosen[i]=k;render()};a.append(b)});
      w.append(a)};
    w.onclick=e=>{if(!w.classList.contains("open"))open();else closeAll();e.stopPropagation()};
    w.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();w.click()}if(e.key==="Escape")closeAll()};
    out.append(w);
  });
}
function closeAll(){document.querySelectorAll(".w.open").forEach(w=>{w.classList.remove("open");w.querySelector(".alt")?.remove()})}
document.addEventListener("click",closeAll);
async function convert(){
  const text=$("#in").value,my=++seq;
  if(!text.trim()){parts=[];chosen=[];render();$("#ms").textContent="";return}
  try{const r=await fetch("/api/transliterate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,n_best:5})});
    const d=await r.json();if(my!==seq)return;parts=d.parts;chosen=[];forced=[];render();$("#ms").textContent=d.ms+" ms"}
  catch(e){$("#ms").textContent="server not reachable"}
}
$("#in").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(convert,160)});
$("#keepen").onchange=render;
$("#copy").onclick=async()=>{const t=parts.map((p,i)=>p.literal!==undefined?p.literal:($("#keepen").checked&&p.english&&!forced[i]?p.src:p.cands[chosen[i]||0])).join("");
  try{await navigator.clipboard.writeText(t);$("#copy").textContent="Copied";setTimeout(()=>$("#copy").textContent="Copy Tamil",1200)}catch{prompt("Copy:",t)}};
$("#clear").onclick=()=>{$("#in").value="";convert();$("#in").focus()};
document.querySelectorAll(".try button").forEach(b=>b.onclick=()=>{$("#in").value=b.textContent;convert();$("#in").focus()});
fetch("/api/info").then(r=>r.json()).then(i=>{$("#info").innerHTML=`<b>${i.name}</b> · test CER ${i.test_cer}% clean, ${i.mix_cer}% under mixed typing noise<br>${i.note}. Each word is converted on its own; English words are kept as typed (frequent-word list; click one to convert it anyway). Some typed forms are genuinely ambiguous: check the alternatives.`});
</script>
</body>
</html>
